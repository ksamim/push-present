<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b13" />
    <meta
      name="description"
      content="Lulu Prissypants' researched push present shortlist."
    />
    <title>Lulu Prissypants' Gift of Light</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Marcellus&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app-layout.css" />
    <script src="supabase-config.js"></script>
    <script src="product-data.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero-art" aria-hidden="true">
        <img class="hero-art__emet" src="assets/art/emet-selch.webp" alt="" />
        <img class="hero-art__lulu" src="assets/art/lulu-prissypants-presenting.png" alt="" />
      </div>
      <div class="hero-shade"></div>
      <div class="hero-content">
        <div class="realm-mark" aria-hidden="true">
          <span></span>
          <img src="assets/ffxiv/limit_break.png" alt="" />
          <span></span>
        </div>
        <p class="eyebrow">Lulu Prissypants' wishlist</p>
        <h1>Choose Your<br />Loot</h1>
        <p class="intro">Scroll down for each category. Swipe sideways to compare the loot.</p>
        <div class="hero-actions">
          <a class="enter-link" href="#category-milk-fridge">
            <img src="assets/ffxiv/journal.png" alt="" />
            Browse her options
          </a>
          <button class="share-button" id="share-button" type="button" aria-label="Share Lulu's shortlist">
            <img src="assets/ffxiv/teleport.png" alt="" />
          </button>
        </div>
      </div>
    </header>

    <main id="collection">
      <nav class="filters" id="category-nav" aria-label="Jump to a gift category"></nav>
      <section class="category-decks" id="category-decks" aria-label="Gift options"></section>
    </main>

    <footer class="site-footer">
      <img src="assets/ffxiv/limit_break.png" alt="" />
      <p class="footer-dedication">For the greatest adventure yet.</p>
      <p class="legal">
        FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.<br />
        FINAL FANTASY XIV materials © SQUARE ENIX
      </p>
    </footer>
  </body>
</html>
